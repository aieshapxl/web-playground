<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>café landing page</title>
  <link rel="stylesheet" href="brew.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <main>
    <div class="coffee-grid">
  
      <div class="card hero-image">
        <img
          class="card-image"
          src="https://images.unsplash.com/photo-1677344060429-545c94ca6fa0?q=80&w=774&auto=format&fit=crop"
          alt="Coffee"
        >

        <div class="icon-circle">
          <i class="fa-solid fa-mug-hot"></i>
        </div>

        <div class="hero-details">
          <span>special roast</span>
          <p>coffee co.</p>
        </div>
      </div>
  
      <div class="card quote-card">
        <!-- <img class="card-image"
          src="https://images.unsplash.com/photo-1679193559674-860ef78899bc?q=80&w=898&auto=format&fit=crop"
          alt="Coffee beans"> -->
        
          <div class="quote-content">
            <span class="card-label">since 1998</span>
            <h3>freshly roasted</h3>
            <p>every single day</p>
          </div>
      </div>
  
      <div class="card menu-card">

        <div class="menu-icon">
          <i class="fa-solid fa-bars-staggered"></i>
        </div>

        <span class="label">coffee menu</span>
        <h3>crafted daily</h3>
        <p>espresso • latte • mocha</p>
      </div>
  
      <div class="card feature-card">
        <img class="card-image"
          src="https://plus.unsplash.com/premium_photo-1763313140267-3aa64e3d359e?q=80&w=870&auto=format&fit=crop"
          alt="Coffee">

          <div class="top-tag">
            <i class="fa-solid fa-location-dot"></i>
            <span>brooklyn</span>
          </div>
      </div>
  
      <div class="card brand-card">
        <i class="fa-solid fa-seedling brand-icon"></i>
        <h1 class="brand-title">caffeine</h1>
        <p>speciality coffee & bakery</p>
      </div>
  
      <div class="card stats-card">
        <i class="fa-solid fa-mug-saucer stats-icon"></i>
        <h2>25k+</h2>
        <p>cups served</p>
      </div>
  
      <div class="card portrait-card">
        <img class="card-image"
          src="https://images.unsplash.com/photo-1720835452850-1785b07147c3?q=80&w=435&auto=format&fit=crop"
          alt="Barista">

          <div class="profile-header">
            <div class="profile-dot"></div>
            <span>caffeine</span>
            <span>2h</span>
          </div>
        
          <div class="profile-content">
            <h2>brew with passion.</h2>
        
            <button class="coffee-btn">
              <i class="fa-solid fa-mug-hot"></i>
              order now
            </button>
          </div>
        
          <i class="fa-solid fa-arrow-rotate-right refresh-icon"></i>
      </div>
  
      <div class="card review-card">
        <i class="fa-solid fa-quote-left quote-icon"></i>
        <h3>★★★★★</h3>
        <p>"coffee first. everything else later."</p>
      </div>
  
      <div class="card landscape-card">

        <img class="card-image"
          src="https://images.unsplash.com/photo-1453614512568-c4024d13c247?q=80&w=1032&auto=format&fit=crop"
          alt="">
      
        <button class="visit-btn">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          visit café
        </button>
      
      </div>
  
    </div>
  </main>
</body>
</html>
