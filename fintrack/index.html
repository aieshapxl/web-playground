<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack Pro - Login</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">
        <span class="material-symbols-rounded">account_balance</span>
      </div>

      <div>
        <h1>FinTrack</h1> <span>Pro</span>
      </div>
    </div>

    <section class="auth-card">
      <div class="auth-header">
        <h2 class="authTitle">Welcome Back</h2>
        <p class="authSubtitle">
          Sign in to continue to your account.
        </p>
      </div>

      <form id="authForm">

        <div class="form-group register-field hidden">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password">
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="button" class="password-toggle" id="passwordToggle">
              <span class="material-symbols-rounded">
                visibility
                </span>
            </button>
          </div>
        </div>

        <div class="form-options login-only">
          <label class="checkbox-label">
            <input type="checkbox">
            <span>Remember me</span>
          </label>

          <button type="button" class="text-button">
            Forgot Password?
          </button>
        </div>

        <button
        type="submit"
        class="primary-button" id="authSubmit"
        >Sign In</button>
      </form>

      <p class="auth-switch">
        <span id="switchText">
          Don't have an account?
        </span>

        <button type="button" id="switchAuth">
          Create account`
        </button>
      </p>
    </section>

    <p class="auth-footer">
      &copy; 2026 FinTrack Pro
    </p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
