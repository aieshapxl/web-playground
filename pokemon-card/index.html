<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pokemon-card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <main class="main-wrapper">

    
      <img class="pokemon-image" src="./assets/pikachu.png" alt="">

    <!-- left section -->
    <section class="left-content">
  
      <img src="./assets/logo.png" alt="" class="logo">
  
      <div class="info-text">
        <span class="generation">pokemon gen i</span>
  
        <h1 class="pokemon-name">pikachu</h1>
  
        <p class="description">
          Pikachu is an Electric-type Pokémon <br>introduced in Generation I.
          Pikachu are small, chubby, and <br>incredibly cute mouse-like Pokémon. <br>
          They are almost completely covered by yellow fur.
        </p>
  
        <div class="counter">
          <span class="line"></span>
          <h3>- 01 / 08</h3>
        </div>
      </div>
    </section>

    <!-- right -->
    <aside class="right-content">
  
      <button class="menu-btn">
        <i class="ri-menu-line"></i>
      </button>
  
      <div class="slider-indicator">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
  
    </aside>
  
  </main>
</body>
</html>
