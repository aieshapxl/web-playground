<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <span>▰</span> ScaleX
    </div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About Us</a>
      <a href="#">Blogs</a>
      <a href="#">Contact Us</a>
    </nav>

    <button>Get Started</button>
  </header>

  <main>
    <section class="hero">

        <button>Tech</button>

    <section class="blogs">

        <img src="./assets/cocktail.png" alt="cocktail">

      <article class="card">

        <img src="./assets/red-chair.png" alt="chair">

        <div class="card-content">
          <span class="tag">SaaS</span>
          <h2>5 Key Trends In SaaS Growth For 2025</h2>
          <p>May 23, 2925</p>
        </div>
      </article>

      <article class="card">

        <img src="./assets/cat.jpg" alt="cocktail">

        <div class="card-content">
          <span class="tag">Marketing</span>
          <h2>How Data-Driven Strategies Are Important</h2>

        </div>
